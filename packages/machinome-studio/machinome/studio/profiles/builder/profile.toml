schema_version = 1
user_label = "Maker"
user_agent = "builder"
work_mode = "direct"

[[agents]]
id = "builder"
label = "Builder"
prompt = "builder.md"
assigns = []

[agents.backends.codex]
model = "gpt-5.3-codex-spark"
effort = "high"
tools = "inherit"

[agents.backends.claude]
model = "sonnet"
effort = "medium"
tools = ["Bash", "Read", "Write", "Edit", "Glob", "Grep"]

[agents.backends.hermes]
model = "inherit"
effort = "inherit"
tools = "inherit"
