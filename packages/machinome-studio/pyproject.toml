[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solid-node-shop-floor"
version = "0.1.0"
description = "The local browser lifecycle surface for solid-node-shop"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136,<1",
    "uvicorn>=0.47,<1",
]

[project.scripts]
shop-floor = "shop_floor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
