[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solid-node-shop"
version = "0.1.0"
description = "The solid-node shop broker and browser acceptance tests"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "watchdog>=6,<7",
]

[tool.setuptools.package-data]
floor = ["static/**"]
[project.optional-dependencies]
e2e = ["playwright==1.61.0"]
