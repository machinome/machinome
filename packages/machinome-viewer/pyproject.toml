[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "machinome-viewer"
version = "0.2.0"
description = "The browser viewer for machinome models: the embeddable widget, the development server and the headless snapshot capture"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Luis Henrique Cassis Fagundes", email = "lhfagundes@gmail.com" },
]
classifiers = [
    # No `License ::` classifier: the SPDX `license` expression above is the
    # licence declaration, and metadata 2.4 forbids stating it twice.
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
keywords = ["machinome", "cad", "viewer", "three.js"]
# The ranges below overlap machinome's own pins, so the two packages
# install into one environment; the viewer depends on nothing of
# machinome itself.
dependencies = [
    "fastapi>=0.111,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
# The headless capture behind `machinome snapshot --renderer web`. Chromium is a
# second, separate step: `playwright install chromium`.
snapshot = [
    "playwright",
]
dev = [
    "pytest>=8",
    "pillow>=10",
    "build>=1.2",
    "twine>=5",
    # Served only `_proxy` (server.py, gone with the development app's npm
    # dev server); kept here for `fastapi.testclient.TestClient`, which
    # needs it in the test environment.
    "httpx>=0.27,<1",
    "playwright",
]

[project.urls]
Homepage = "https://github.com/machinome/machinome-viewer"

[project.scripts]
machinome-viewer = "machinome_viewer.cli:main"

# How machinome finds the installed viewer: one entry point that resolves to
# a function returning the bundle path, the export page and the API version.
# Nothing else of this package is an interface to it.
[project.entry-points."machinome.viewer"]
bundle = "machinome_viewer.bundle:describe"

[tool.setuptools.packages.find]
include = ["machinome_viewer", "machinome_viewer.*"]
namespaces = false

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.exclude-package-data]
machinome_viewer = [
    "widget/src/*",
    "widget/build.mjs",
    "widget/package-lock.json",
    "widget/tsconfig.json",
    "widget/vitest.config.ts",
]

[tool.setuptools.cmdclass]
sdist = "machinome_viewer.packaging.BuildSourceDistribution"
build_py = "machinome_viewer.packaging.BuildPythonWithFrontend"

[tool.pytest.ini_options]
testpaths = ["tests"]
