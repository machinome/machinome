schema: spec-driven

# Project context shown to AI when creating artifacts.
context: |
  machinome-viewer is the browser viewer for machinome models, the
  repository's package `machinome.viewer.web` at
  packages/machinome-viewer/ of the machinome repository: the embeddable
  three.js widget (machinome/viewer/web/widget, TypeScript, built by esbuild
  to dist/machinome-viewer.js, the one member of the root's npm workspace)
  with the export page and the static development page beside it, the
  FastAPI development server (machinome/viewer/web/server.py) and the
  Playwright capture (machinome/viewer/web/capture.py), packaged for pip as
  `machinome-viewer`, numbered with the framework and licensed as every
  package of the repository.

  The framework reaches it through its seam of viewers, `machinome.viewer`,
  importing it at `machinome.viewer.web` and calling its operations in its
  own process; no entry point names it. It installs no command of its own:
  its verbs are the framework's `machinome viewer describe|serve|capture`,
  which `python -m machinome.viewer.web` runs.

  Conventions:
  - TDD: red-first, one commit per increment.
  - The widget's tests run with vitest (npm test) and typecheck with tsc.
    The Python suite (pytest) skips what its environment lacks -- a
    headless Chromium, Playwright, Pillow -- and says so per test.
  - Test fixtures are committed exports under tests/fixtures; the suite
    depends on nothing of the framework.
  - The viewer API version is declared once, in widget/package.json as
  machinomeViewerApi, and rises on incompatible interface changes or
    when a capability a host may require is added. Document schema
    versions belong to the producer.
  - Published names are a compatibility contract: machinome-viewer.js,
    data-machinome-widget, MachinomeViewer, the /_viewer and /build/ routes.

rules:
  specs:
    - Describe observable behavior of the current system only; no aspirational requirements in main specs.
