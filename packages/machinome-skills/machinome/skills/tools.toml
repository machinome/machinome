# The tools `machinome skills` installs the skills for (change
# `join-skills`, capability `skills-distribution`): every tool of OpenSpec
# 1.6.0's installer that has a skills directory, by OpenSpec's id and in its
# order, so an id names the same tool in both installers, and first
# `agents`, the .agents/skills/ convention of Agent Skills.
#
# Each tool: `name`, its display name; `detect`, the paths whose presence in
# a project marks the tool detected (OpenSpec's dot-directory, or its
# detection paths, and the client's current directory where it differs);
# `project`, the skills directory under a project; `personal`, the skills
# directory under the user's home, absent where the tool documents none;
# `source`, where the row's directories come from. A personal directory
# marked "inferred" is OpenSpec's dot-directory under the home, not
# verified; a finding changes this data, not the code.

[[tool]]
id = "agents"
name = "Agent Skills, the .agents convention"
detect = [".agents"]
project = ".agents/skills/"
personal = "~/.agents/skills/"
source = "The Agent Skills convention, read by Codex, pi, OpenCode, Kilo Code, Gemini CLI and GitHub Copilot (12 October 2026)."

