[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "machinome-mechanics"
version = "0.1.0"
description = "Mechanical formula helpers for machinome projects"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Luis Henrique Cassis Fagundes", email = "lhfagundes@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = ["machinome>=0.7.0"]

[project.urls]
Homepage = "https://github.com/machinome/machinome-mechanics"
Documentation = "https://machinome-mechanics.readthedocs.io/en/latest/"
Source = "https://github.com/machinome/machinome-mechanics"
Issues = "https://github.com/machinome/machinome-mechanics/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2", "twine>=5"]
docs = ["Sphinx==9.1.0", "sphinx_rtd_theme==3.1.0"]

[tool.setuptools.packages.find]
include = ["machinome_mechanics", "machinome_mechanics.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
