schema: spec-driven
context: |
  machinome-mechanics is an Apache-2.0 collection of mechanical formula helpers
  for machinome projects. It depends on machinome and uses machinome.math;
  machinome must never depend on this package. Python >=3.11.
  Initial version 0.1.0 is founded, not published. Project migration is separate.
  Preserve numeric/symbolic parity and documented degrees, frames and signs.
rules:
  specs:
    - Describe implemented behavior and keep formulas and conventions testable.
