<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 290" role="img" aria-labelledby="title desc">
  <title id="title">Choosing a circle intersection</title>
  <desc id="desc">The direction from centre A to centre B points right. The branch for side 1 is above it at (4,3); side minus 1 is below it at (4,-3).</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b"/></marker></defs>
  <rect width="480" height="290" rx="12" fill="#f8fafc"/>
  <g fill="none" stroke="#94a3b8" stroke-width="1.5"><circle cx="160" cy="145" r="100"/><circle cx="320" cy="145" r="100"/></g>
  <path d="M160 145 H320" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M160 145 L240 85 L320 145" fill="none" stroke="#2980b9" stroke-width="3"/>
  <path d="M160 145 L240 205 L320 145" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4"/>
  <g fill="#2980b9"><circle cx="240" cy="85" r="5"/><circle cx="240" cy="205" r="5"/></g>
  <g fill="#334155"><circle cx="160" cy="145" r="4"/><circle cx="320" cy="145" r="4"/></g>
  <g fill="#334155" font-family="sans-serif" font-size="14">
    <text x="118" y="168">A (0, 0)</text><text x="311" y="168">B (8, 0)</text>
    <text x="194" y="41">side = 1 · (4, 3)</text><text x="183" y="261">side = −1 · (4, −3)</text>
    <text x="190" y="108">5</text><text x="284" y="108">5</text>
  </g>
</svg>
