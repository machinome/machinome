[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "machinome"
version = "0.8.1"
description = "Source code for machines — a Python framework for mechanical design and simulation"
readme = { file = "README.rst", content-type = "text/x-rst" }
requires-python = ">=3.11"
license = "GPL-2.0-or-later OR CERN-OHL-S-2.0+"
license-files = ["LICENSE", "LICENSES/*.txt"]
authors = [
    { name = "Luis Fagundes", email = "lhfagundes@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["machinome"]
dependencies = [
    "watchdog",
    "trimesh==4.4.*",
    # No CAD kernel and no node type is required: the node types (the
    # extras `cadquery`, `build123d`, `step`, `molejo`, `openscad`,
    # `solid2`, `jscad`, `stl` and `freecad`), the B-rep engine (the extra
    # `brep`) and the mesh engine (the extra `mesh`) are the extras below,
    # each named by the last component of the address of the module that
    # needs it (OpenSpec changes `lean-install`, `mesh-engine`,
    # `openscad-out` and `brep-mesh`).
    "httpx==0.27.*",
    "fastapi==0.111.*",
    "termcolor==2.4.*",
    "asgiref==3.8.*",
    "uvicorn==0.30.*",
    "numpy==2.2.*",
    "rtree",
    "scipy",
    # A member of the vet universe's kernel tier (machinome/vet/universe.toml):
    # a member the framework does not install, directly or through an extra,
    # would let a project pass `machinome vet` and fail at import. Pinned to
    # the installed minor.
    "shapely==2.1.*",
]

[project.optional-dependencies]
dev = [
    # The suite runs every kernel, so the development install takes them all.
    "machinome[all]",
    "bump2version",
    "flake8>=7",
    "coverage>=7",
    "Sphinx>=7",
    "twine>=5",
    "pytest>=8",
    "pillow>=10",
    "black>=25.1",
    "build>=1.2",
    # tests/test_docs_exports.py reads .readthedocs.yaml and the Actions
    # workflow. PyYAML arrives anyway as a transitive of trame; this is
    # the direct use declared rather than left to that accident.
    "pyyaml",
    "pytest-watch",
    "ipython",
    "ipdb",
]
docs = [
    "sphinx",
    "sphinx_rtd_theme",
]
# The browser viewer is a separate AGPL-3.0-or-later package. The framework is
# complete for non-interactive use without it; interactive development needs
# this extra. OpenSCAD remains the default fixed-pose snapshot renderer. The
# two packages are numbered together: the floor is the matching viewer the
# manual declares (docs/conf.py, viewer_version), and
# tests/test_release_records.py holds the two together.
viewer = [
    "machinome-viewer>=0.8.1",
]
# The web snapshot renderer needs the viewer and its browser; Chromium itself
# is a second step: `playwright install chromium`.
web-snapshot = [
    "machinome-viewer[snapshot]>=0.8.1",
]
# `machinome.mechanics`, the mechanics helpers, the repository's distribution
# machinome-mechanics at its own version; the framework never imports them.
mechanics = [
    "machinome-mechanics>=0.1.0",
]
# The B-rep engine (`machinome.engine.brep`, resolved by its seam in
# `machinome.engine`) is the distribution machinome-engine-brep, which
# states the OCCT range.
brep = [
    "machinome-engine-brep~=0.8.1",
]
# The mesh engine (`machinome.engine.mesh`, resolved by its seam in
# `machinome.engine`) is the distribution machinome-engine-mesh, over
# manifold3d, for every comparison on meshes: a part without B-rep
# geometry, `machinome test --mesh`, `assertAssemblySupported` and a fusion
# of such parts. No node extra includes it: a B-rep project needs it only
# for a mesh question, which it may never ask.
mesh = [
    "machinome-engine-mesh~=0.8.1",
]
# The node types over OCCT, each named by the last component of its address
# and each the distribution machinome-node-<name>, which states its kernel
# and requires the B-rep engine, so the OCCT range, stated once in
# machinome-engine-brep, resolves one OCCT binding for several extras.
#
# `machinome.node.cadquery` (CadQueryNode).
cadquery = [
    "machinome-node-cadquery~=0.8.1",
]
# `machinome.node.build123d` (Build123dNode, Build123dSheetNode and the
# reducer of Svg artwork).
build123d = [
    "machinome-node-build123d~=0.8.1",
]
# `machinome.node.step` (StepNode, StepAssembly, `machinome import-step`),
# which reads with CadQuery and the OCCT binding itself and requires the
# CadQuery node type.
step = [
    "machinome-node-step~=0.8.1",
]
# `machinome.node.molejo` (MolejoNode), with molejo and its OCCT evaluator.
molejo = [
    "machinome-node-molejo~=0.8.1",
]
# The node types that need no B-rep engine, each named by the last
# component of its address and each the distribution
# machinome-node-<name>.
#
# The OpenSCAD node family (`machinome.node.openscad`: OpenScadNode, the
# OpenSCAD writer and the OpenSCAD snapshot renderer), which writes SCAD
# through SolidPython; the OpenSCAD executable itself is no extra's to
# install.
openscad = [
    "machinome-node-openscad~=0.8.1",
]
# `machinome.node.solid2` (Solid2Node), which renders with SolidPython over
# the OpenSCAD node family and requires it.
solid2 = [
    "machinome-node-solid2~=0.8.1",
]
# `machinome.node.jscad` (JScadNode), which runs the `jscad` command, a Node
# program no pip extra installs.
jscad = [
    "machinome-node-jscad~=0.8.1",
]
# `machinome.node.stl` (StlNode), which reads meshes with trimesh, which the
# core requires.
stl = [
    "machinome-node-stl~=0.8.1",
]
# `machinome.node.freecad` (FreeCADAssemblyNode, FreeCADJoint), which reads
# a native FreeCAD assembly through FreeCAD, a program no pip extra
# installs, found through MACHINOME_FREECAD_ROOT; its occurrences are B-rep
# leaves, so the distribution requires the B-rep engine.
freecad = [
    "machinome-node-freecad~=0.8.1",
]
# The machinome skills and the command `machinome skills` that installs
# them into assistants' skill directories (`machinome.skills`), the
# repository's distribution machinome-skills, numbered with the set.
skills = [
    "machinome-skills~=0.8.1",
]
all = [
    "machinome[cadquery,build123d,step,molejo,brep,mesh,openscad,solid2,jscad,stl,freecad]",
]
# Machinome Studio is still experimental and unpublished. Declaring its final
# extra name now does not make the dependency available from a package index.
studio = [
    "machinome-studio",
]

[project.urls]
Homepage = "https://github.com/machinome/machinome"

[project.scripts]
machinome = "machinome.cli:manage"

[tool.setuptools.packages.find]
include = ["machinome", "machinome.*"]

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.pytest.ini_options]
testpaths = ["tests"]
