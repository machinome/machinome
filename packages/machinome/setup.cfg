[flake8]
exclude = docs
# A module whose kernel is an extra checks that kernel before importing it
# (machinome.extras.require_extra; OpenSpec change `lean-install`), so in the
# modules that import a kernel at their top the kernel imports follow that call.
per-file-ignores =
    machinome/node/step.py:E402
    machinome/node/molejo.py:E402
    ../machinome-engine-brep/machinome/engine/brep.py:E402
    ../machinome-engine-mesh/machinome/engine/mesh.py:E402
    machinome/node/openscad/__init__.py:E402
    machinome/node/solid2.py:E402
