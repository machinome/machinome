version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
    nodejs: "22"
  # The manual takes the repository's own browser viewer, which the framework
  # finds through its seam of viewers (change `viewer-seam`): its bundle is
  # built from the root's npm lock before Sphinx runs. Read the Docs runs
  # these at the repository root.
  jobs:
    pre_build:
      - npm ci --no-audit --no-fund
      - npm run build --workspace packages/machinome-viewer/machinome/viewer/web/widget

# The manual builds from docs/requirements.txt alone, Sphinx and its theme,
# with the repository's viewer completing the committed tutorial exports
# under docs/_exports/. Nothing is exported here and no other package is
# installed; the real machines are shown on machinome.org. Kept in step with
# the docs job in .github/workflows/python-app.yml, and pinned by
# tests/test_docs_exports.py.
#
# This file sits beside the manual, in the framework's directory: the Read
# the Docs project's configuration path is
# packages/machinome/.readthedocs.yaml. Read the Docs reads every path in it
# from the repository root, so each names packages/machinome/.
python:
  install:
    - requirements: packages/machinome/docs/requirements.txt

sphinx:
  configuration: packages/machinome/docs/conf.py
  fail_on_warning: true
