# framework tutorial's clocked counter and three movies, one with its own
# stage module. Nothing here is a real machine or a real film.
[project]
name = "videomaker-fixture-project"
version = "0.0.0"

[tool.machinome.models]
seesaw = "models.seesaw:Seesaw"
counter = "models.counter:Counter"

[tool.machinome.movies]
minimal = "videos.minimal.movie:Minimal"
tour = "videos.tour.movie:Tour"
count = "videos.count.movie:Count"
