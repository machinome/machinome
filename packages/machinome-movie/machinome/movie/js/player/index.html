<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Videomaker player</title>
<link rel="stylesheet" href="/player.css">
</head><body>
<header class="vm-bar"><h1 id="title">Videomaker player</h1><nav id="surfaces" aria-label="Surfaces"></nav><span id="status"></span></header>
<section id="messages" aria-live="polite"><p id="refusal" role="alert" hidden></p><p id="fault" role="alert" hidden></p><p id="note" hidden></p></section>
<main id="surface"></main>
<div id="ruler" class="vm-ruler"></div>
<section id="readout" aria-label="Readout"></section>
<p id="caption" hidden></p>
<script src="/player.js"></script>
</body></html>
