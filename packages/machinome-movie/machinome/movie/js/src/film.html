<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Machinome film stage</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#faf7ef;color:#222;font-family:'DejaVu Sans',sans-serif}
#brand{position:absolute;top:4%;left:6%;font-size:1.05vw;letter-spacing:.16em;color:#237c86;font-weight:700}
#series{position:absolute;top:4%;right:6%;font-size:.85vw;letter-spacing:.1em;color:#685f54}
#viewport{position:absolute;inset:16% 5% 21%}
#stage{width:100%;height:100%}
#overlays{position:absolute;inset:0;pointer-events:none}
#annotations{position:absolute;inset:0;pointer-events:none}
#pictures{display:none;position:absolute;overflow:hidden;pointer-events:none}
#picture-plate{position:absolute;inset:0;background:var(--film-background,#faf7ef)}
#picture-image{position:absolute;max-width:none;max-height:none;image-orientation:none}
.has-picture #pictures{display:block;z-index:1}
.has-picture #overlays{z-index:2}
.has-picture #transition{z-index:3}
.has-picture #brand,.has-picture #series,.has-picture #rule{z-index:4}
#annotations svg{position:absolute;left:0;top:0;overflow:visible}
.annotation-text{position:absolute;width:max-content;max-width:30vw;white-space:pre-line;font-weight:600;font-size:1.25vw;line-height:1.3;padding:.25em .55em;background:var(--film-background,#faf7ef)}
.overlay{position:absolute;left:6%;right:6%;text-align:center;white-space:pre-line;font-weight:600;line-height:1.45}
.top{top:9%;font-size:1.8vw}
.lower-third{bottom:16%;font-size:1.2vw;color:#514b43;background:var(--film-background,#faf7ef);padding:.3em .65em}
.center{top:43%;font-size:2vw}
.title{top:30%;font-size:4.1vw;line-height:1.12;font-weight:700;letter-spacing:-.03em}
.title .subtitle{display:block;margin-top:.65em;font-size:1.05vw;font-weight:400;letter-spacing:0;line-height:1.35}
mark.spoken{background:color-mix(in srgb,var(--film-accent,#bf531f) 18%,transparent);border-radius:2px;box-shadow:0 2px 0 var(--film-accent,#bf531f);color:inherit}
#source{display:none;position:absolute;left:5%;top:25%;width:49%;bottom:18%;border-top:1px solid #cfc7ba;padding:1.2vw 1.2vw 0 1px;contain:paint}
#source-file{color:#766c60;font: .7vw 'DejaVu Sans Mono',monospace;letter-spacing:.01em;margin-bottom:1.5vw}
#source pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:1.02vw/1.8 'DejaVu Sans Mono',monospace;color:#3a342e}
#source code{font:inherit}
#source-cursor{display:inline-block;border-left:2px solid #bf531f;height:1.1em;vertical-align:-.15em}
.with-code #source{display:block}
.with-code #viewport{inset:20% 2% 15% 56%}
.with-code .top{top:11%;font-size:2.35vw;text-align:left;left:5%;font-weight:500;letter-spacing:-.025em}
.with-code .lower-third{bottom:7%;left:5%;right:5%;text-align:left;font-size:1.05vw;font-weight:400}
.hljs-keyword,.hljs-literal{color:#a34820;font-weight:600}
.hljs-title,.hljs-built_in{color:#216f78}
.hljs-string{color:#577443}
.hljs-number{color:#9a562d}
.hljs-comment{color:#817767}
.hljs-params{color:#5b5677}
#rule{position:absolute;bottom:2.5%;left:6%;right:6%;height:2px;background:#d9d2c7}
#transition{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#transition>*{position:absolute;top:0}
.in-mark-blend #transition{z-index:2}
.in-transition #brand,.in-transition #series,.in-transition #rule{z-index:1}
.has-picture.in-transition #brand,.has-picture.in-transition #series,.has-picture.in-transition #rule{z-index:4}
.picture-only #brand,.picture-only #series,.picture-only #rule{visibility:hidden}
#progress{height:100%;background:#237c86;width:0}
</style></head><body>
<div id="brand">MACHINOME</div><div id="series">LEONARDO · HOW IT WORKS</div>
<div id="viewport"><div id="stage"></div></div><div id="annotations"></div><div id="overlays"></div>
<section id="source"><div id="source-file"></div><pre><code id="source-code"></code><span id="source-cursor"></span></pre></section>
<div id="pictures"><div id="picture-plate"></div><img id="picture-image" alt=""></div>
<div id="transition"></div>
<div id="rule"><div id="progress"></div></div>
<script src="/viewer.js"></script><script src="/film.js"></script>
</body></html>
