schema: spec-driven

context: |
  Videomaker is an independent local production tool. The first concrete consumer
  is Leonardo's hydraulic sawmill. Projects own readable YAML video sources and
  ignored generated media. Mechanical behavior belongs to the existing simulation;
  viewer capabilities belong to the separate machinome-viewer repository.
  No publishing, external hosting or distribution-license choice is implicit.
rules:
  proposal:
    - Name the consuming project and its present need; avoid speculative features.
  specs:
    - Describe author/audience outcomes and observable refusals, not internal transport.
  tasks:
    - Separate implementation evidence from human review and publication approval.

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
