schema: spec-driven

context: |
  Videomaker, a local production tool for narrated films of machinome models, is
  the machinome repository's distribution machinome-movie at
  packages/machinome-movie/: its Python package is machinome.movie, its Node side
  at machinome/movie/js/, its command machinome movie, under the repository's
  licence. Its specs and changes are here; the framework's specs are the
  framework's, at packages/machinome/openspec/. Projects own readable YAML video
  sources and ignored generated media. Mechanical behavior belongs to the
  existing simulation; viewer capabilities belong to the browser viewer,
  packages/machinome-viewer/. No publishing or external hosting is implicit.
rules:
  proposal:
    - Name the consuming project and its present need; avoid speculative features.
  specs:
    - Describe author/audience outcomes and observable refusals, not internal transport.
  tasks:
    - Separate implementation evidence from human review and publication approval.

