#
# The names the lean-core campaign's tenth cycle moved, for
# scripts/load-projects --moved. Framework branch v0.8-split-root-cleanup;
# record in the framework's openspec/changes/archive/<date>-root-cleanup/.
#
# The node package's root, machinome/node/__init__.py, exports nothing
# (pilot, 5 October 2026). Each of the twenty-one names it resolved at
# 815ceb9 is imported from the module that defines it, and importing it from
# the root raises an ImportError whose message begins
#   module 'machinome.node' has no attribute '<name>':
# and names that module, so a failing load is explained by the row of its
# name. No alias, no deprecation path (ADR-169). A module import of the
# package's own submodules (`from machinome.node import supported`, `phase`,
# `step`, ...) is not a moved name and still resolves. The rows are the
# twenty-one [[import]] rows of the workspace's
# scripts/rewrite-projects.d/root-cleanup.toml, root block, name for name.

cycle = "root-cleanup"
date = "2026-10-05"

