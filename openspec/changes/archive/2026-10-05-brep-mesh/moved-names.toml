#
# The names the lean-core campaign's ninth cycle moved, for
# scripts/load-projects --moved. Framework branch v0.8-split-brep-mesh;
# record in the framework's openspec/changes/archive/<date>-brep-mesh/.
#
# The two engines are named for the representation each consumes (pilot,
# 4 October 2026): `brep`, a boundary representation of parametric surfaces
# (OCCT today), and `mesh`, a polyhedral triangle mesh (manifold3d today).
# Both seams live in the engine package's __init__, machinome.engine, whose
# path admits portions; the providers are machinome.engine.brep and
# machinome.engine.mesh. machinome.exact_engine, machinome.mesh_engine,
# machinome.occt and machinome.manifold are removed (Python's own
# ModuleNotFoundError; no alias, ADR-169). ExactLeafNode is BrepLeafNode at
# machinome.node.brep_leaf; the capability `exact` is `brep`; the memos and
# the artifact publication are machinome.brep_cache and
# machinome.brep_artifacts. The run's choice is its engine (pilot, at
# ratification): machinome.test.KERNELS is ENGINES, ComparisonPolicy.kernel
# is .engine, and SOLID_TEST_KERNEL is SOLID_TEST_ENGINE, the former
# variable refused when set. The rows marked informational name a flag, an
# environment variable or value, an extra or a recipe identity: no load
# fails on them, and the root cleanup's rewrite applies them to command
# lines, `.env` files and manifests.

