name: Python application

on: [push]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/machinome

    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.8"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # The workspace from its lock: every package under packages/ editable
      # in compat mode, with the framework's dev extra (every kernel, the
      # tools). --locked fails when uv.lock is stale. Run at the root, where
      # the default group is declared; the venv's bin/ joins the PATH of the
      # later steps.
      - name: Sync the workspace
        working-directory: .
        run: |
          uv sync --locked --python 3.12
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Black
        continue-on-error: true
        run: black --check machinome tests ../machinome-*/machinome

      - name: Flake8
        continue-on-error: true
        run: flake8 --max-line-length=89 machinome tests ../machinome-*/machinome

  test:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: packages/machinome

    steps:
      - uses: actions/checkout@v4

      - uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: openscad
          version: 1.0

      - name: Setup uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.8"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # The workspace from its lock: every package under packages/ editable
      # in compat mode, with the framework's dev extra (every kernel, the
      # tools). --locked fails when uv.lock is stale. Run at the root, where
      # the default group is declared; the venv's bin/ joins the PATH of the
      # later steps.
      - name: Sync the workspace
        working-directory: .
        run: |
          uv sync --locked --python 3.12
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      # The browser viewer's widget is the npm workspace's member (change
      # `join-viewer`): one install at the root, its typecheck and tests,
      # and the bundle the suite and the viewer's tests photograph through.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build and test the widget
        working-directory: .
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck --workspaces --if-present
          npm test --workspaces --if-present
          npm run build --workspaces --if-present

      - name: Run tests
        run: |
          coverage run --source machinome -m pytest
          coverage report -m

      # The mechanics helpers keep their tests in their own directory
      # (change `join-mechanics`); the workspace synced above installs them.
      - name: Run the mechanics package's tests
        working-directory: packages/machinome-mechanics
        run: python -m pytest

      # The viewer keeps its tests in its own directory; its browser tests
      # need Chromium for the Playwright the lock installs.
      - name: Run the viewer package's tests
        working-directory: packages/machinome-viewer
        run: |
          playwright install --with-deps chromium
          python -m pytest

  browser-snapshot:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: packages/machinome

    steps:
      - uses: actions/checkout@v4

      - uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: openscad
          version: 1.0

      - name: Setup uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.8"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # The workspace from its lock: every package under packages/ editable
      # in compat mode, with the framework's dev extra (every kernel, the
      # tools). --locked fails when uv.lock is stale. Run at the root, where
      # the default group is declared; the venv's bin/ joins the PATH of the
      # later steps.
      - name: Sync the workspace
        working-directory: .
        run: |
          uv sync --locked --python 3.12
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      # The synced workspace installs the viewer with Playwright (change
      # `join-viewer`); its bundle is built from the root's npm workspace,
      # and Chromium is the browser it photographs through.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build the viewer and install Chromium
        working-directory: .
        run: |
          npm ci --no-audit --no-fund
          npm run build --workspaces --if-present
          playwright install --with-deps chromium

      - name: Run real browser snapshot test
        env:
          MACHINOME_WEB_SNAPSHOT_E2E: "1"
        run: >-
          pytest
          tests/test_browser_renderer.py::BrowserSnapshotEndToEndTest

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/machinome

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: packages/machinome/docs/requirements.txt

      # The manual builds from docs/requirements.txt alone: Sphinx, its
      # theme and the published machinome-viewer, whose widget completes
      # the committed tutorial exports. Nothing is exported here; the real
      # machines are shown on machinome.org. Kept in step with
      # .readthedocs.yaml, and pinned by tests/test_docs_exports.py.
      - name: Install docs requirements
        run: pip install -r docs/requirements.txt

      - name: Build docs (fail on warnings)
        run: python -m sphinx -b html -W docs docs/_build

  dist:
    runs-on: ubuntu-latest
    needs: [test, docs]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and twine
        run: pip install build twine

      # The viewer's source distribution builds its bundle with npm (change
      # `join-viewer`).
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Builds every package of the repository, checks the archives and
      # smokes them in a throwaway environment outside the checkout.
      # Uploads nothing.
      - name: Check the distributions
        run: scripts/check-dist

  build:
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: write

    env:
      MACHINOME_VERSION: "${{ github.ref_name }}"
    defaults:
      run:
        working-directory: packages/machinome

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packaging
        run: pip install packaging

      - name: Detect package version
        id: package_version
        run: |
          from os import getenv as env
          from packaging.version import parse
          machinome_version = str(parse(env("MACHINOME_VERSION")))
          print(f"version={machinome_version}", file=open(env("GITHUB_OUTPUT"), "a"), flush=True)
        shell: python

      - name: Install requirements
        run: pip install build

      - name: Build python package
        run: make dist

      - name: Create release
        if: steps.package_version.outputs.version != null
        run: |
          gh release create "$MACHINOME_VERSION" ./dist/* \
            --title "${{ steps.package_version.outputs.version }}" \
            --repo="$GITHUB_REPOSITORY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
