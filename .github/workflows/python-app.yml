name: Python application

on: [push]

permissions:
  contents: read

# Every job calls the repository's Makefile at the root (change
# `release-tooling`): the commands a contributor runs are the commands CI
# runs. The setup steps (uv and the locked workspace, Node, OpenSCAD,
# Chromium) stay the workflow's.

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.8"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # The workspace from its lock: every package under packages/ editable
      # in compat mode, with the framework's dev extra (every kernel, the
      # tools). --locked fails when uv.lock is stale. Run at the root, where
      # the default group is declared; the venv's bin/ joins the PATH of the
      # later steps.
      - name: Sync the workspace
        working-directory: .
        run: |
          uv sync --locked --python 3.12
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      # black and flake8 over every package's sources, both always run.
      - name: Lint
        continue-on-error: true
        run: make lint

  test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: openscad
          version: 1.0

      - name: Setup uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.8"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # The workspace from its lock: every package under packages/ editable
      # in compat mode, with the framework's dev extra (every kernel, the
      # tools). --locked fails when uv.lock is stale. Run at the root, where
      # the default group is declared; the venv's bin/ joins the PATH of the
      # later steps.
      - name: Sync the workspace
        working-directory: .
        run: |
          uv sync --locked --python 3.12
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # The npm workspace from its lock at the root and the viewer's bundle,
      # which the suite and the viewer's tests photograph through.
      - name: Build the bundles
        run: make widget

      # The viewer's browser tests need Chromium for the Playwright the lock
      # installs, with the system libraries it needs.
      - name: Install Chromium
        run: playwright install --with-deps chromium

      # The studio's tests run the OpenSpec CLI, the studio's runtime
      # prerequisite, installed as a maker installs it (change `join-studio`).
      - name: Install the OpenSpec CLI
        run: npm install -g @fission-ai/openspec@1.6.0

      # Every package with tests of its own, one after another, stopping at
      # the first failure: the core's suite, the mechanics', the skills',
      # the viewer's widget and Python tests, the movie's Python tests and
      # the Node projects that open no browser, and the studio's frontend
      # build and tests, its browser tests left to a contributor's machine.
      - name: Run the tests, the framework's under coverage
        run: make test PYTEST='$(PYTHON) -m coverage run --source machinome -m pytest'
      - name: Report the framework's coverage
        run: cd packages/machinome && ../../.venv/bin/python -m coverage report -m

  browser-snapshot:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: openscad
          version: 1.0

      - name: Setup uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.8"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # The workspace from its lock: every package under packages/ editable
      # in compat mode, with the framework's dev extra (every kernel, the
      # tools). --locked fails when uv.lock is stale. Run at the root, where
      # the default group is declared; the venv's bin/ joins the PATH of the
      # later steps.
      - name: Sync the workspace
        working-directory: .
        run: |
          uv sync --locked --python 3.12
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      # The synced workspace installs the viewer with Playwright (change
      # `join-viewer`); its bundle is built from the root's npm workspace,
      # and Chromium is the browser it photographs through.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build the bundles
        run: make widget

      - name: Install Chromium
        run: playwright install --with-deps chromium

      # No target runs the real browser's capture: it is this job's own.
      - name: Run real browser snapshot test
        working-directory: packages/machinome
        env:
          MACHINOME_WEB_SNAPSHOT_E2E: "1"
        run: >-
          pytest
          tests/test_browser_renderer.py::BrowserSnapshotEndToEndTest

  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.8"
          enable-cache: true
          cache-dependency-glob: packages/machinome/docs/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # The manual builds from docs/requirements.txt alone, in an
      # environment of its own: Sphinx and its theme, with the repository's
      # own browser viewer, which the framework finds through its seam of
      # viewers, completing the committed tutorial exports; `make docs`
      # builds the viewer's bundle first, from the npm workspace `make
      # widget` installs from the root's lock (change `viewer-seam`). Nothing
      # is exported here; the real machines are shown on machinome.org. Kept
      # in step with .readthedocs.yaml, and pinned by
      # tests/test_docs_exports.py.
      - name: Install the npm workspace and build its bundles
        run: make widget

      - name: Build the manual (fail on warnings)
        run: make docs

  dist:
    runs-on: ubuntu-latest
    needs: [test, docs]

    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.8"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync the workspace
        working-directory: .
        run: |
          uv sync --locked --python 3.12
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      # The viewer's source distribution builds its bundle with npm (change
      # `join-viewer`), and the movie's smoke installs its Node side (change
      # `join-movie`).
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Builds every package of the repository from the tree and from a
      # clean copy of its tracked files, checks the archives and smokes them
      # in a throwaway environment outside the checkout. Keeps nothing and
      # uploads nothing.
      - name: Check the distributions
        run: make check

  build:
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.8"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync the workspace
        working-directory: .
        run: |
          uv sync --locked --python 3.12
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: The tag names the set's version
        run: test "$GITHUB_REF_NAME" = "v$(make -s version)"

      # The release's archives, built from the tagged commit, checked and
      # smoked, kept in dist/vX.Y.Z. Nothing is uploaded to a package
      # index: that is the pilot's `make upload`.
      - name: Build the release
        run: make dist

      - name: Create release
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/$GITHUB_REF_NAME"/* \
            --title "${GITHUB_REF_NAME#v}" \
            --repo="$GITHUB_REPOSITORY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
