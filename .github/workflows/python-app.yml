name: Python application

on: [push]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements_dev.txt

      - name: Install requirements
        run: pip install -r requirements.txt -r requirements_dev.txt

      - name: Black
        continue-on-error: true
        run: black --check machinome tests

      - name: Flake8
        continue-on-error: true
        run: flake8 --max-line-length=89 machinome tests

  test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: openscad
          version: 1.0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements_dev.txt

      - name: Install requirements
        run: pip install -r requirements.txt -r requirements_dev.txt

      - name: Run tests
        run: |
          coverage run --source machinome -m pytest
          coverage report -m

  browser-snapshot:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: openscad
          version: 1.0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements_dev.txt

      # The viewer's source distribution builds its widget bundle, so node
      # is needed here for that build and nothing else.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install framework and browser snapshot dependencies
        run: |
          pip install -r requirements.txt -r requirements_dev.txt
          pip install "machinome-viewer[snapshot] @ git+https://github.com/machinome/machinome-viewer.git"
          playwright install --with-deps chromium

      - name: Run real browser snapshot test
        env:
          MACHINOME_WEB_SNAPSHOT_E2E: "1"
        run: >-
          pytest
          tests/test_browser_renderer.py::BrowserSnapshotEndToEndTest

  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: docs/requirements.txt

      # The manual builds from docs/requirements.txt alone: Sphinx, its
      # theme and the published machinome-viewer, whose widget completes
      # the committed tutorial exports. Nothing is exported here; the real
      # machines are shown on machinome.org. Kept in step with
      # .readthedocs.yaml, and pinned by tests/test_docs_exports.py.
      - name: Install docs requirements
        run: pip install -r docs/requirements.txt

      - name: Build docs (fail on warnings)
        run: python -m sphinx -b html -W docs docs/_build

  build:
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: write

    env:
      MACHINOME_VERSION: "${{ github.ref_name }}"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements_dev.txt

      - name: Install packaging
        run: pip install packaging

      - name: Detect package version
        id: package_version
        run: |
          from os import getenv as env
          from packaging.version import parse
          machinome_version = str(parse(env("MACHINOME_VERSION")))
          print(f"version={machinome_version}", file=open(env("GITHUB_OUTPUT"), "a"), flush=True)
        shell: python

      - name: Install requirements
        run: pip install -r requirements.txt -r requirements_dev.txt

      - name: Build python package
        run: make dist

      - name: Create release
        if: steps.package_version.outputs.version != null
        run: |
          gh release create "$MACHINOME_VERSION" ./dist/* \
            --title "${{ steps.package_version.outputs.version }}" \
            --repo="$GITHUB_REPOSITORY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
