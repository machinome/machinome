[bumpversion]
current_version = 0.7.1
commit = True
tag = True

[bumpversion:file:pyproject.toml]
search = version = "{current_version}"
replace = version = "{new_version}"

[bumpversion:file:machinome/__init__.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"

[bumpversion:file:docs/conf.py]
search = release = '{current_version}'
replace = release = '{new_version}'

[bumpversion:file:machinome/vet/universe.toml]
search = version = "{current_version}"
replace = version = "{new_version}"

[flake8]
exclude = docs
# A module whose kernel is an extra checks that kernel before importing it
# (machinome.extras.require_extra; OpenSpec change `lean-install`), so in the
# three that import a kernel at their top the kernel imports follow that call.
per-file-ignores =
    machinome/node/step.py:E402
    machinome/node/molejo.py:E402
    machinome/occt/engine.py:E402
