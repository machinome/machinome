# The machinome repository: a uv workspace whose members are the
# distributions under packages/, each in the directory named as its
# distribution. The root is no distribution of its own.

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
machinome = { workspace = true }
machinome-engine-brep = { workspace = true }
machinome-engine-mesh = { workspace = true }
machinome-mechanics = { workspace = true }
machinome-movie = { workspace = true }
machinome-node-build123d = { workspace = true }
machinome-node-cadquery = { workspace = true }
machinome-node-freecad = { workspace = true }
machinome-node-jscad = { workspace = true }
machinome-node-molejo = { workspace = true }
machinome-node-openscad = { workspace = true }
machinome-node-solid2 = { workspace = true }
machinome-node-step = { workspace = true }
machinome-node-stl = { workspace = true }
machinome-viewer = { workspace = true }
machinome-skills = { workspace = true }
machinome-studio = { workspace = true }

[tool.uv]
# Every member installs editable in compat mode, a .pth line per package
# directory, so a namespace portion's directory is on sys.path where the
# core's path extension (machinome._namespace_portions) admits it. uv reads
# this setting here at the root and nowhere else.
config-settings = { editable_mode = "compat" }

[dependency-groups]
# `uv sync` at the root installs this group by default: the framework's dev
# extra, which installs every kernel the suite runs, the mechanics package
# the catalogue's projects import, so the universe sweep reads them from
# this venv, the skills package, the movie package and the studio, whose
# tests run from their directories and whose commands the suite's
# conformance walk reads.
dev = ["machinome[dev]", "machinome[mechanics]", "machinome[skills]",
       "machinome[movie]", "machinome[studio]"]
