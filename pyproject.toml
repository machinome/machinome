[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "machinome"
version = "0.8.0"
description = "Source code for machines — a Python framework for mechanical design and simulation"
readme = { file = "README.rst", content-type = "text/x-rst" }
requires-python = ">=3.11"
license = "GPL-2.0-or-later OR CERN-OHL-S-2.0+"
license-files = ["LICENSE", "LICENSES/*.txt"]
authors = [
    { name = "Luis Fagundes", email = "lhfagundes@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["machinome"]
dependencies = [
    "watchdog",
    "trimesh==4.4.*",
    # No CAD kernel is required: cadquery, build123d, ocp-gordon, molejo, the
    # OCCT binding (the extra `brep`), manifold3d (the extra `mesh`) and
    # SolidPython are the extras below, each named by the last component of
    # the address of the module that needs it (OpenSpec changes
    # `lean-install`, `mesh-engine`, `openscad-out` and `brep-mesh`).
    "httpx==0.27.*",
    "fastapi==0.111.*",
    "termcolor==2.4.*",
    "asgiref==3.8.*",
    "uvicorn==0.30.*",
    "numpy==2.2.*",
    "rtree",
    "scipy",
    # A member of the vet universe's kernel tier (machinome/vet/universe.toml):
    # a member the framework does not install, directly or through an extra,
    # would let a project pass `machinome vet` and fail at import. Pinned to
    # the installed minor.
    "shapely==2.1.*",
]

[project.optional-dependencies]
dev = [
    # The suite runs every kernel, so the development install takes them all.
    "machinome[all]",
    "bump2version",
    "flake8>=7",
    "tox>=4",
    "coverage>=7",
    "Sphinx>=7",
    "twine>=5",
    "pytest>=8",
    "pillow>=10",
    "black>=25.1",
    "build>=1.2",
    # tests/test_docs_exports.py reads .readthedocs.yaml and the Actions
    # workflow. PyYAML arrives anyway as a transitive of trame; this is
    # the direct use declared rather than left to that accident.
    "pyyaml",
    "pytest-watch",
    "ipython",
    "ipdb",
]
docs = [
    "sphinx",
    "sphinx_rtd_theme",
]
# The browser viewer is a separate AGPL-3.0-or-later package. The framework is
# complete for non-interactive use without it; interactive development needs
# this extra. OpenSCAD remains the default fixed-pose snapshot renderer. The
# two packages are numbered together: the floor is the matching viewer the
# manual declares (docs/conf.py, viewer_version), and
# tests/test_release_records.py holds the two together.
viewer = [
    "machinome-viewer>=0.8.0",
]
# The web snapshot renderer needs the viewer and its browser; Chromium itself
# is a second step: `playwright install chromium`.
web-snapshot = [
    "machinome-viewer[snapshot]>=0.8.0",
]
mechanics = [
    "machinome-mechanics",
]
# The B-rep engine (`machinome.engine.brep`, resolved by its seam in
# `machinome.engine`) needs only the OCCT kernel, in the range the pinned
# cadquery 2.7 requires; the cut that moves the engine into
# machinome-engine-brep repoints this extra at that package.
brep = [
    "cadquery-ocp>=7.8.1,<7.9",
]
# The mesh engine (`machinome.engine.mesh`, resolved by its seam in
# `machinome.engine`) needs manifold3d, for every comparison on meshes:
# a part without B-rep geometry, `machinome test --mesh`,
# `assertAssemblySupported` and a fusion of such parts. Unranged, as it was
# when required. No node extra includes it: a B-rep project needs it only
# for a mesh question, which it may never ask.
mesh = [
    "manifold3d",
]
# The kernel extras, each named by the last component of the address of the
# module that needs it, each installing the `brep` extra too, so the OCCT
# range is stated once and several extras resolve one OCCT binding.
#
# cadquery and build123d both bind the single OCP module through the
# cadquery-ocp distribution, so their ranges must intersect. This pair is the
# newest that resolves to one OCP (7.8): cadquery 2.8 moved to cadquery-ocp
# >=7.9 while build123d 0.11 moved to cadquery-ocp-novtk, a second
# distribution installing the same OCP package. One range per kernel:
# `cadquery` and `step` name CadQuery alike.
cadquery = [
    "cadquery==2.7.*",
    "machinome[brep]",
]
build123d = [
    "build123d==0.10.*",
    # build123d 0.10 leaves this transitive dependency unbounded; 0.3
    # imports OCP 8 collections absent from our shared OCP 7.8 runtime.
    "ocp-gordon>=0.2.2,<0.3",
    "machinome[brep]",
]
# `machinome.node.step` reads with CadQuery and the OCCT binding itself.
step = [
    "cadquery==2.7.*",
    "machinome[brep]",
]
# The flexible leaf evaluates molejo shapes and reaches for molejo's OCCT
# evaluator, so `brep`. Pinned to the minor: a molejo minor carries the
# shape-spec version it implements, and the documents this framework writes
# name that version.
molejo = [
    "molejo[brep]==0.2.*",
    "machinome[brep]",
]
# The OpenSCAD node family (`machinome.node.openscad`: OpenScadNode, the
# OpenSCAD writer and the OpenSCAD snapshot renderer) writes SCAD through
# SolidPython; the OpenSCAD executable itself is no extra's to install.
openscad = [
    "solidpython2==2.1.*",
]
# `machinome.node.solid2` (Solid2Node) renders with SolidPython over the
# OpenSCAD node family.
solid2 = [
    "machinome[openscad]",
]
# `machinome.node.jscad` (JScadNode) runs the `jscad` command, a Node program
# no pip extra installs; the extra names the node type and installs nothing.
jscad = []
# `machinome.node.stl` (StlNode) reads meshes with trimesh, which the core
# requires; the extra names the node type and installs nothing.
stl = []
all = [
    "machinome[cadquery,build123d,step,molejo,brep,mesh,openscad,solid2,jscad,stl]",
]
# Machinome Studio is still experimental and unpublished. Declaring its final
# extra name now does not make the dependency available from a package index.
studio = [
    "machinome-studio",
]

[project.urls]
Homepage = "https://github.com/machinome/machinome"

[project.scripts]
machinome = "machinome.cli:manage"

[tool.setuptools.packages.find]
include = ["machinome", "machinome.*"]

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.pytest.ini_options]
testpaths = ["tests"]
